<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuralForms — Hệ thống thu thập dữ liệu</title>
  <meta name="description" content="Hệ thống form thu thập dữ liệu Rural WCM Miền Bắc">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
      padding: clamp(40px, 8vw, 80px) clamp(16px, 5vw, 40px);
      text-align: center;
      color: white;
    }
    .hero-icon { font-size: clamp(3rem, 8vw, 5rem); display: block; margin-bottom: 16px; }
    .hero h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; margin-bottom: 8px; letter-spacing: -0.03em; }
    .hero p { font-size: clamp(0.9rem, 2.5vw, 1.1rem); opacity: 0.85; max-width: 480px; margin: 0 auto 28px; }
    .hero-stats {
      display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
      margin-top: 24px;
    }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-size: 1.8rem; font-weight: 800; line-height: 1; }
    .hero-stat-label { font-size: 0.8rem; opacity: 0.7; margin-top: 2px; }

    .section-title {
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 700;
      color: var(--gray-700);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .empty-state {
      text-align: center;
      padding: clamp(32px, 8vw, 64px) 24px;
      color: var(--gray-400);
    }
    .empty-state .empty-icon { font-size: 3rem; display: block; margin-bottom: 12px; }

    .admin-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--gray-50);
      border: 1.5px dashed var(--gray-300);
      border-radius: var(--radius);
      color: var(--gray-500);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .admin-link:hover { border-color: var(--primary-mid); color: var(--primary); background: var(--primary-light); }
  </style>
</head>
<body>

<!-- Hero -->
<section class="hero">
  <span class="hero-icon">📊</span>
  <h1>RuralForms</h1>
  <p>Hệ thống thu thập dữ liệu thực địa<br><strong>Rural WCM — Miền Bắc</strong></p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <a href="admin/" class="btn" style="background:rgba(255,255,255,0.15);color:white;border:1.5px solid rgba(255,255,255,0.4)">
      🔐 Admin
    </a>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="count-forms">—</div>
      <div class="hero-stat-label">Forms active</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num">📱</div>
      <div class="hero-stat-label">Mobile-first</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num">⚡</div>
      <div class="hero-stat-label">Tức thì</div>
    </div>
  </div>
</section>

<!-- Forms list -->
<main class="container">
  <div id="forms-loading" style="text-align:center;padding:32px">
    <div class="loading-spinner" style="width:28px;height:28px;border-width:2px;border-color:var(--gray-200);border-top-color:var(--primary);display:inline-block"></div>
    <p class="text-muted mt-2">Đang tải danh sách forms...</p>
  </div>

  <div id="forms-container" style="display:none">
    <div class="section-title">📋 Forms đang hoạt động</div>
    <div id="forms-list"></div>
    <div style="margin-top:24px">
      <a href="admin/" class="admin-link">
        <span style="font-size:1.2rem">🔧</span>
        <div>
          <div style="font-weight:600;color:var(--gray-600)">Quản lý & Tạo form mới</div>
          <div class="text-xs">Đăng nhập Admin để tạo, chỉnh sửa và theo dõi submissions</div>
        </div>
        <span style="margin-left:auto;font-size:1.2rem">→</span>
      </a>
    </div>
  </div>
</main>

<footer style="text-align:center;padding:24px;color:var(--gray-400);font-size:0.82rem;margin-top:32px;border-top:1px solid var(--gray-200)">
  RuralForms · Rural WCM Miền Bắc · <a href="admin/" style="color:var(--gray-400)">Admin</a>
</footer>

<script>
  // Forms registry — sync this with admin/index.html FORMS_REGISTRY
  const FORMS = [
    {
      id: 'mat-tien',
      title: 'Thống kê kích thước mặt tiền',
      subtitle: 'Đo kích thước Block mặt kính để dán POSM',
      icon: '📐',
      url: 'f/mat-tien/',
      configUrl: 'forms/mat-tien/config.json'
    }
  ];

  async function loadForms() {
    const loading = document.getElementById('forms-loading');
    const container = document.getElementById('forms-container');
    const list = document.getElementById('forms-list');

    const activeForms = [];
    for (const form of FORMS) {
      try {
        const res = await fetch(form.configUrl + '?t=' + Date.now());
        const cfg = await res.json();
        if (cfg.enabled !== false) {
          activeForms.push({ ...form, config: cfg });
        }
      } catch {
        // Could not load, skip
      }
    }

    loading.style.display = 'none';
    container.style.display = 'block';

    document.getElementById('count-forms').textContent = activeForms.length;

    if (!activeForms.length) {
      list.innerHTML = `<div class="empty-state">
        <span class="empty-icon">📭</span>
        <div style="font-weight:600">Chưa có forms nào đang hoạt động</div>
        <div class="text-sm text-muted mt-1">Liên hệ admin để được cấp quyền truy cập</div>
      </div>`;
      return;
    }

    list.innerHTML = activeForms.map(f => `
      <a href="${f.url}" class="form-card">
        <div class="form-card-icon">${f.icon || '📋'}</div>
        <div class="form-card-info">
          <div class="form-card-title">${f.config?.title || f.title}</div>
          <div class="form-card-sub">${f.config?.subtitle || f.subtitle || ''}</div>
        </div>
        <div class="form-card-arrow">›</div>
      </a>
    `).join('');
  }

  loadForms();
</script>
</body>
</html>
